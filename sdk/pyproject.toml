[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-qwen25-omni"
version = "1.0.0"
description = "Encrypted Qwen2.5-Omni inference SDK"
requires-python = ">=3.10,<3.13"
dependencies = ["pandora-runtime>=1.0.2,<2", "numpy>=1.23,<3", "Pillow>=9,<13", "soundfile>=0.12,<1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["pandora_qwen25_omni", "pandora_qwen25_omni.*"]

[tool.setuptools.package-data]
pandora_qwen25_omni = ["LICENSES/*"]
