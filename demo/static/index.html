<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qwen2.5-Omni · Pandora</title>
  <link rel="icon" href="/static/pandora-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="icons" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11Z"/><path d="M8 9h8m-8 4h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M20 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5m4-1 7 7m-9 3 8-8a2 2 0 0 1 3 3l-8 8-4 1Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  </defs></svg>
  <aside class="sidebar">
    <a class="rail-title" href="/" aria-label="Pandora 首页"><img src="/static/pandora-mark.svg" alt="">Pandora<span>LAB</span></a>
    <button class="new-chat" id="new-chat"><svg><use href="#i-new"/></svg>新对话<span>＋</span></button>
    <div class="rail-label">历史对话</div>
    <nav id="history-list" class="history-list" aria-label="历史对话"></nav>
    <div class="rail-item"><svg><use href="#i-chat"/></svg>Omni 多模态对话<span class="tiny-dot"></span></div>
    <div class="rail-bottom"><span class="device-icon">Q</span><div><strong>运行于本地设备</strong><small id="device-soc">Qualcomm</small></div></div>
  </aside>
  <div class="workspace">
    <header>
      <div class="model-title"><strong>Qwen2.5-Omni <span>3B</span></strong><span class="connection" id="connection"><i></i>连接中</span></div>
      <label class="language-control"><span class="sr-only">界面语言</span><select id="language-select" aria-label="界面语言"><option value="zh">中文</option><option value="en">English</option></select></label>
      <div class="brand"><img class="logo" src="/static/logo.png" alt="APLUX"><span class="divider"></span><img class="mark" src="/static/pandora-mark.svg" alt=""><span class="name">Pandora</span></div>
    </header>
    <main id="scroll-area">
      <section class="welcome" id="welcome">
        <div class="hero-mark"><img src="/static/pandora-mark.svg" alt=""></div>
        <div class="eyebrow">PANDORA · ON-DEVICE AI</div>
        <h1>你好，有什么可以帮你？</h1>
        <p>文字、图片与声音，在一个窗口里探索。</p>
        <div class="preset-grid">
          <button class="preset" data-preset="text"><span class="card-icon lavender"><svg><use href="#i-chat"/></svg></span><strong>聊聊端侧 AI</strong><span>用几句话，了解身边的 AI。</span><b>体验文字 <span>↗</span></b></button>
          <button class="preset" data-preset="image"><span class="card-icon peach"><svg><use href="#i-image"/></svg></span><strong>看图说颜色</strong><span>给模型一张图，听听它的发现。</span><b>体验图片 <span>↗</span></b></button>
          <button class="preset" data-preset="audio"><span class="card-icon mint"><svg><use href="#i-audio"/></svg></span><strong>听一段短音频</strong><span>上传一段声音，把语音变成文字。</span><b>体验音频 <span>↗</span></b></button>
        </div>
        <div class="preset-audio-preview"><span>预设 WAV 试听</span><audio id="preset-audio" controls preload="metadata" src="/api/presets/audio/asset" aria-label="试听预设音频"></audio></div>
      </section>
      <section class="messages" id="messages" aria-label="对话内容" aria-live="polite" aria-relevant="additions"></section>
    </main>
    <div class="composer-area">
      <div id="context-status" class="context-status" role="status" aria-live="polite" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <form class="composer" id="composer">
        <div class="attachment" id="attachment" hidden></div>
        <label class="sr-only" for="prompt">输入问题</label>
        <textarea id="prompt" rows="1" placeholder="输入问题，或添加图片 / WAV 音频…" maxlength="8000"></textarea>
        <div class="composer-toolbar">
          <div class="attach-wrap">
            <button class="icon-button attach-button" id="attach-button" type="button" aria-label="添加图片或音频" aria-expanded="false"><svg><use href="#i-plus"/></svg></button>
            <div class="attach-menu" id="attach-menu" hidden>
              <button id="choose-image" type="button"><svg><use href="#i-image"/></svg><span>上传图片<small>JPG / PNG · 最大 10 MB</small></span></button>
              <button id="choose-audio" type="button"><svg><use href="#i-audio"/></svg><span>上传 WAV 音频<small>16 kHz · 单声道 · 最长 20 秒</small></span></button>
            </div>
          </div>
          <span class="composer-hint" id="composer-hint">文字 · 图片 · WAV 音频</span>
          <details class="context-meter" id="context-meter">
            <summary id="context-trigger" aria-label="上下文用量 0%，0 / -- tokens" title="上下文已使用 0% · 0 / -- tokens">
              <svg class="context-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="context-track" cx="12" cy="12" r="8.5"/><circle id="context-progress" class="context-arc" cx="12" cy="12" r="8.5" pathLength="100" stroke-dasharray="0 100"/></svg>
            </summary>
            <div class="context-popover"><strong id="context-label">上下文 0 / -- · 0%</strong><p id="context-details">回答预留 256 tokens；达到容量前自动整理较早对话。</p></div>
          </details>
          <button class="send-button" id="send" type="submit" aria-label="发送消息" disabled><svg><use href="#i-arrow"/></svg></button>
          <button class="send-button stop-button" id="stop" type="button" aria-label="停止生成" hidden><svg><use href="#i-stop"/></svg></button>
        </div>
      </form>
      <div class="footnote"><span>连续对话 · 自动整理历史并保留最近两轮 · 最多 8 张图片和 1 段音频</span><span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span></div>
    </div>
  </div>
  <input id="image-file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden>
  <input id="audio-file" type="file" accept="audio/wav,audio/x-wav,.wav" hidden>
</body>
</html>
